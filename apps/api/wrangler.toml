name = "payccount-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Webhook 再送と外部レート取得（RATES_PROVIDER=live のとき）を Cron で回す（無料枠）
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# 秘密情報（SUPABASE_SERVICE_ROLE_KEY, JWT_SECRET など）は .dev.vars / wrangler secret で設定する。
# .env.example を参照。
[vars]
AUTH_MODE = "supabase"
APP_URL = "http://localhost:5173"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://localhost:5175"
DEMO_MOCK_ENDPOINTS = "true"
RATES_PROVIDER = "mock"
