name = "payccount-shop-global"
pages_build_output_dir = "dist"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Orders and webhook logs are stored in KV (free tier).
# `wrangler pages dev --kv ORDERS` simulates it locally.
# For deployment replace the id with the one from `wrangler kv namespace create ORDERS`.
[[kv_namespaces]]
binding = "ORDERS"
id = "00000000000000000000000000000000"

# Secrets (PAYCCOUNT_SECRET_KEY, PAYCCOUNT_WEBHOOK_SECRET) go to .dev.vars / Pages environment variables
[vars]
PAYCCOUNT_API_URL = "http://localhost:8787"
